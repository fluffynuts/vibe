memory: 12g
agent: claude
# what vibe does about the companion page it serves for a running sandbox
# (network log and rules, clipboard): open — serve it and open the browser;
# serve — serve it and just print the address; off — don't serve it. -N
# turns it off for one run.
companion: open
# ticked by default when a guided profile is created — the user can untick
# any of them while picking, and naming a feature the library doesn't have
# is an error rather than a silent no-op
defaultFeatures:
  - diffity
  - clipboard-bridge
