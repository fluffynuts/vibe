name: yumbi
displayName: Yumbi dotnet sandbox
description: .NET SDK, MySQL/Redis/RabbitMQ and Elasticsearch for the yumbi codebase
permissions:
  network:
    allow:
      # diffity: the CLI from npm, its skills from the skills CLI
      - registry.npmjs.org
      - add-skill.vercel.sh
      # apt
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - "*.ubuntu.com"
      - packages.microsoft.com
      # Elasticsearch
      - artifacts.elastic.co
      # NuGet restore
      - api.nuget.org
      - "*.nuget.org"
      # dotnet-install.sh — aka.ms is where it redirects from
      - dot.net
      - aka.ms
      - builds.dotnet.microsoft.com
      - dotnetcli.azureedge.net
      - dotnetcli.blob.core.windows.net
ports:
  - container: 5391
    protocol: tcp
    name: diffity
environment:
  variables:
    DIFFITY_HOST: "localhost"
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
