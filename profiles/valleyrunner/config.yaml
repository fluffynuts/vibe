# vibe profile "valleyrunner".
#
# This file is a docker sbx kit fragment, overlaid on the bundle's base
# config.yaml at sandbox creation. Anything the base sets — permissions,
# environment, requires — can be added to or overridden here.
#
# Alongside it, a profile may carry:
#   settings.yaml          memory, agent, publish, nugetDir, ... overrides
#   install-scripts/       run once at creation, in leading-number order
#   agent-files/           copied into /home/agent in the sandbox
#   agent-instructions.md  appended to the agent's instructions
name: valleyrunner
displayName: valleyrunner sandbox
description: Sandbox for the valleyrunner workspace
