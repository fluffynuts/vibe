<!doctype html>
<!-- The clipboard page, served by clipboard-server.js: paste here and it
     reaches the agent.
     No template literals or dollar-brace forms anywhere in this file: sbx
     validates them in a kit's file content against its own placeholder list. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibe clipboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677;
    --border: #d9dde5; --accent: #2f6fde; --accent-text: #ffffff;
    --pending: #b26a00; --pending-bg: #fff3dd; --sent: #23794a; --sent-bg: #e3f5ea;
    --danger: #b3261e; --drop: #e9f0fd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171d; --panel: #1d2129; --text: #e6e9ef; --muted: #9aa3b2;
      --border: #333a46; --accent: #6b9cf5; --accent-text: #0d1220;
      --pending: #f0b35a; --pending-bg: #3a2d14; --sent: #6dd39b; --sent-bg: #173324;
      --danger: #f2817a; --drop: #1d2a42;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* The page itself never scrolls: the instructions stay put and only the
     list scrolls (beneath them here, beside them in the split layout). */
  html, body { height: 100%; overflow: hidden; }
  main {
    max-width: 960px; margin: 0 auto; padding: 24px 16px 0; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
  }
  #top { flex: none; }
  #list { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 24px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .host { color: var(--muted); font-size: 14px; }
  #drop {
    border: 2px dashed var(--border); border-radius: 12px; background: var(--panel);
    padding: 28px 16px; text-align: center; transition: background .15s, border-color .15s;
  }
  #drop.over { background: var(--drop); border-color: var(--accent); }
  #drop strong { display: block; font-size: 17px; margin-bottom: 4px; }
  #drop p { margin: 4px 0; color: var(--muted); }
  kbd {
    font: 12px ui-monospace, monospace; border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; background: var(--bg);
  }
  button, .button {
    font: inherit; font-size: 14px; border: 1px solid var(--border); background: var(--panel);
    color: var(--text); border-radius: 8px; padding: 5px 12px; cursor: pointer;
  }
  button:hover, .button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
  button.danger { color: var(--danger); }
  .actions .ask { align-self: center; color: var(--danger); }
  #status { min-height: 1.5em; margin: 10px 2px; color: var(--muted); font-size: 14px; }
  #status.error { color: var(--danger); }
  #clearbar { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin: 0 2px 10px; }
  #clearbar:empty { display: none; }
  #clearbar .ask { color: var(--danger); font-size: 14px; }
  /* Fixed, so that it appearing and going never moves the page: it can come up while someone is
     looking at the list, and a shift draws the eye to the very thing that isn't worth chasing. */
  #link {
    position: fixed; top: 8px; right: 12px; max-width: calc(100% - 24px); z-index: 1;
    background: var(--panel); color: var(--danger); border: 1px solid var(--danger);
    border-radius: 8px; padding: 3px 10px; font-size: 13px;
  }
  #link[hidden] { display: none; }
  /* Says what was just done, then goes: what needs reading stays in #status. */
  #toast {
    position: fixed; right: 12px; bottom: 12px; max-width: calc(100% - 24px);
    background: var(--panel); color: var(--text); border: 1px solid var(--accent);
    border-radius: 8px; padding: 8px 12px; font-size: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.3);
  }
  #items, #held { display: grid; gap: 12px; }
  #held:not(:empty) { margin-bottom: 12px; }
  #held .item { grid-template-columns: 1fr auto; align-items: center; padding: 8px 12px; border: 1px dashed var(--border); border-radius: 8px; }
  #held .what { min-width: 0; overflow-wrap: anywhere; }
  #held .why { color: var(--muted); font-size: 13px; }
  .item {
    display: grid; grid-template-columns: 160px 1fr; gap: 14px; align-items: start;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px;
  }
  .item.current { border-color: var(--accent); }
  .preview {
    width: 160px; height: 110px; border-radius: 8px; overflow: hidden; background: var(--bg);
    display: flex; align-items: center; justify-content: center; border: 1px solid var(--border);
  }
  .preview img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  .preview pre {
    margin: 0; padding: 8px; width: 100%; height: 100%; overflow: hidden; font-size: 11px;
    white-space: pre-wrap; word-break: break-word; color: var(--muted);
  }
  .preview .ext { font: 600 18px ui-monospace, monospace; color: var(--muted); }
  .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .details { color: var(--muted); font-size: 13px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 12px; border-radius: 999px; padding: 1px 9px; }
  .badge.pending { color: var(--pending); background: var(--pending-bg); }
  .badge.sent { color: var(--sent); background: var(--sent-bg); }
  .badge.cur { color: var(--accent); border: 1px solid var(--accent); }
  .title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .title-row .title { cursor: text; min-width: 0; }
  button.edit {
    flex: none; background: none; border: 0; padding: 2px 4px; cursor: pointer;
    color: var(--muted); font-size: 14px; line-height: 1;
  }
  button.edit:hover { color: var(--accent); }
  input.title-edit {
    font: inherit; font-weight: 600; flex: 1; min-width: 0; padding: 2px 6px;
    background: var(--bg); color: var(--text); border: 1px solid var(--accent); border-radius: 6px;
  }
  input.title-edit:focus { outline: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .empty { color: var(--muted); text-align: center; padding: 24px; }
  #zoom {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none;
    align-items: center; justify-content: center; padding: 16px; cursor: zoom-out;
  }
  #zoom.open { display: flex; }
  #zoom img { max-width: 100%; max-height: 100%; }
  @media (max-width: 560px) {
    .item { grid-template-columns: 1fr; }
    .preview { width: 100%; height: 180px; }
  }
  /* Split layout: the paste instructions take the left third, full height,
     and only the items scroll, in the right two thirds. It is for a phone, and for
     the companion page's conversation tab when it stacks this page under the
     conversation (it says so by message). Left off in the companion's
     clipboard column on a desktop, which is narrow but tall. */
  /* Framed by the companion page, which already says where it is: the title is clutter there. */
  html.framed h1 { display: none; }
  html.split main { display: grid; grid-template-columns: 1fr 2fr; grid-template-rows: minmax(0, 1fr); gap: 12px; padding: 0 10px; }
  html.split #top {
    grid-column: 1; min-height: 0; overflow-y: auto;
    padding: 12px 0; display: flex; flex-direction: column; gap: 8px;
  }
  html.split header { margin: 0; flex-direction: column; gap: 0; }
  html.split h1 { font-size: 17px; }
  html.split .host { font-size: 12px; }
  html.split #drop { padding: 14px 10px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  html.split #drop strong { font-size: 15px; }
  html.split #status { font-size: 13px; margin: 6px 2px; }
  html.split #list { grid-column: 2; padding-top: 12px; min-width: 0; }
</style>
</head>
<body>
<main>
  <div id="top">
  <header>
    <h1>vibe clipboard</h1>
    <span class="host" id="host"></span>
  </header>

  <section id="drop">
    <strong>Paste anywhere on this page (<kbd>Ctrl</kbd>+<kbd>V</kbd>), or drop files here</strong>
    <p class="hint">It goes to the agent with your next message — give it a title first, if it needs explaining.</p>
    <p class="hint"><kbd>Ctrl</kbd>+<kbd>V</kbd> in the agent's terminal also attaches the item marked <em>current</em>.</p>
    <p><label class="button">Choose files<input id="picker" type="file" multiple hidden></label></p>
  </section>

  <div id="status" role="status"></div>
  </div>
  <div id="list">
  <div id="clearbar"></div>
  <section id="held" aria-live="polite"></section>
  <section id="items" aria-live="polite"></section>
  </div>
</main>
<div id="zoom"><img alt=""></div>
<div id="link" role="status" hidden></div>
<div id="toast" role="status" hidden></div>

<script>
"use strict";
var itemsEl = document.getElementById("items");
var statusEl = document.getElementById("status");
var dropEl = document.getElementById("drop");
var zoomEl = document.getElementById("zoom");
var lastRendered = "";
var textCache = {};

function setStatus(message, isError) {
  statusEl.textContent = message || "";
  statusEl.className = isError ? "error" : "";
}

var toastEl = document.getElementById("toast");
var toastTimer = null;

// toast says what was just done, for a few seconds.
function toast(message) {
  setStatus("");
  toastEl.textContent = message;
  toastEl.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.hidden = true; }, 3000);
}

function formatSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

function formatTime(iso) {
  var d = new Date(iso);
  var sameDay = d.toDateString() === new Date().toDateString();
  return sameDay ? d.toLocaleTimeString() : d.toLocaleString();
}

function el(tag, attrs, children) {
  var node = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === "text") node.textContent = attrs[k];
    else if (k === "onclick") node.addEventListener("click", attrs[k]);
    else node.setAttribute(k, attrs[k]);
  });
  (children || []).forEach(function (c) { if (c) node.appendChild(c); });
  return node;
}

function contentURL(item) {
  return "/api/items/" + item.id + "/content";
}

function loadText(item, pre) {
  if (textCache[item.id] !== undefined) { pre.textContent = textCache[item.id]; return; }
  fetch(contentURL(item)).then(function (r) { return r.text(); }).then(function (t) {
    textCache[item.id] = t;
    pre.textContent = t;
  });
}

function preview(item) {
  if (item.kind === "image") {
    var img = el("img", { src: contentURL(item), alt: item.name || "pasted image", loading: "lazy" });
    img.addEventListener("click", function () {
      zoomEl.querySelector("img").src = contentURL(item);
      zoomEl.classList.add("open");
    });
    return el("div", { class: "preview" }, [img]);
  }
  if (item.kind === "text") {
    var pre = el("pre");
    loadText(item, pre);
    return el("div", { class: "preview" }, [pre]);
  }
  var ext = (item.path.split(".").pop() || "file").toUpperCase();
  return el("div", { class: "preview" }, [el("span", { class: "ext", text: ext })]);
}

function title(item) {
  if (item.name) return item.name;
  if (item.kind === "image") return "Pasted image";
  if (item.kind === "text") return "Pasted text";
  return "File";
}

// editing says whether a title is being typed in: re-rendering then would
// pull the box from under the user, so that render waits for the next poll.
function editing() {
  var a = document.activeElement;
  return !!a && a.classList && a.classList.contains("title-edit");
}

function saveTitle(item, value) {
  return fetch("/api/items/" + item.id, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ description: value }),
  }).then(function (r) {
    if (!r.ok) throw new Error(r.statusText);
  }).catch(function (err) {
    setStatus("Couldn't save that title: " + err.message, true);
  });
}

// titleRow is the item's title, which turns into a text box when it or the
// pencil beside it is clicked. What's typed is the item's description: the
// label the agent is shown for it. Enter or leaving the box saves, Escape
// abandons.
function titleRow(item) {
  var row = el("div", { class: "title-row" });
  function show() {
    row.textContent = "";
    var label = el("div", { class: "title", text: item.description || title(item), title: "Click to rename" });
    label.addEventListener("click", edit);
    var pencil = el("button", { class: "edit", text: "\u270E", title: "Rename", "aria-label": "Rename" });
    pencil.addEventListener("click", edit);
    row.appendChild(label);
    row.appendChild(pencil);
  }
  function edit() {
    var input = el("input", { class: "title-edit", type: "text", maxlength: "200", "aria-label": "Title" });
    input.value = item.description || title(item);
    var done = false;
    function finish(save) {
      if (done) return;
      done = true;
      var value = input.value.trim();
      if (!save || value === (item.description || title(item))) { show(); refresh(); return; }
      // Clearing the box goes back to the default title. The box goes as
      // soon as it's done with: while it has the focus, nothing re-renders.
      item.description = value === title(item) ? "" : value;
      show();
      saveTitle(item, item.description).then(refresh);
    }
    input.addEventListener("keydown", function (e) {
      if (e.isComposing) return;
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
    });
    input.addEventListener("blur", function () { finish(true); });
    row.textContent = "";
    row.appendChild(input);
    input.focus();
    input.select();
  }
  show();
  return row;
}

// confirming is the item whose Delete was pressed, waiting on Yes or Keep:
// asked here, in the page, as a browser's own confirm() is suppressed in
// the frame the companion page shows this page in. clearing is the same
// for Clear all.
var confirming = null;
var clearing = false;

function renderClearBar(count) {
  var bar = document.getElementById("clearbar");
  bar.textContent = "";
  if (!count) { clearing = false; return; }
  if (clearing) {
    bar.appendChild(el("span", { class: "ask", text: "Delete all " + count + (count === 1 ? " item" : " items") + "? There's no undo." }));
    bar.appendChild(el("button", { class: "danger", text: "Yes, clear all", onclick: function () { clearing = false; clearAll(); } }));
    bar.appendChild(el("button", { text: "Keep", onclick: function () { clearing = false; render(lastData); } }));
    return;
  }
  bar.appendChild(el("button", { class: "danger", text: "Clear all\u2026", onclick: function () { clearing = true; render(lastData); } }));
}
var lastData = null;

function render(data) {
  lastData = data;
  document.getElementById("host").textContent = data.host ? "sandbox: " + data.host : "";
  if (editing()) return;
  var key = JSON.stringify(data) + "|" + confirming + "|" + clearing;
  if (key === lastRendered) return;
  lastRendered = key;
  renderClearBar(data.items.length);
  itemsEl.textContent = "";
  if (!data.items.length) {
    itemsEl.appendChild(el("div", { class: "empty", text: "Nothing here yet." }));
    return;
  }
  data.items.forEach(function (item) {
    var badges = [
      item.delivered
        ? el("span", { class: "badge sent", text: "sent to agent", title: "at " + formatTime(item.delivered) })
        : el("span", { class: "badge pending", text: "waiting for the agent" }),
    ];
    if (item.id === data.current) badges.push(el("span", { class: "badge cur", text: "current" }));
    var card = el("article", { class: "item" + (item.id === data.current ? " current" : "") }, [
      preview(item),
      el("div", { class: "meta" }, [
        titleRow(item),
        el("div", { class: "details", text: item.type + " · " + formatSize(item.size) + " · " + formatTime(item.created) }),
        el("div", { class: "badges" }, badges),
        el("div", { class: "actions" }, confirming === item.id ? [
          el("span", { class: "ask", text: "Delete it? There's no undo." }),
          el("button", { class: "danger", text: "Yes, delete", onclick: function () { confirming = null; remove(item); } }),
          el("button", { text: "Keep", onclick: function () { confirming = null; render(lastData); } }),
        ] : [
          el("button", { class: "primary", text: "Copy", onclick: function () { copy(item); } }),
          el("button", { class: "danger", text: "Delete…", onclick: function () { confirming = item.id; render(lastData); } }),
        ]),
      ]),
    ]);
    itemsEl.appendChild(card);
  });
}

// A sandbox waking from sleep restarts this server, so a look or two can fail without anything
// being wrong; the page looks every couple of seconds, so it says so only once a few have failed
// in a row, and takes it back as soon as one succeeds.
var LOOKS_BEFORE_SAYING = 3;
var failedLooks = 0;
function showReachable(reachable) {
  failedLooks = reachable ? 0 : failedLooks + 1;
  var linkEl = document.getElementById("link");
  linkEl.textContent = "Can't reach the clipboard server — is the sandbox running?";
  linkEl.hidden = failedLooks < LOOKS_BEFORE_SAYING;
}

function refresh() {
  return fetch("/api/items").then(function (r) { return r.json(); }).then(function (data) {
    showReachable(true);
    render(data);
    sendHeld();
  }, function () {
    showReachable(false);
  });
}

// A server that can't be reached is not the user's doing, and what they pasted is theirs to
// keep: it waits here, in this page's memory (so not past closing it, which is asked about), and
// goes when the server answers. An answer that refuses it is another matter, and is said.
var held = [];

function upload(blob, name) {
  var headers = { "Content-Type": blob.type || "application/octet-stream" };
  if (name) headers["X-Filename"] = encodeURIComponent(name);
  return fetch("/api/items", { method: "POST", headers: headers, body: blob }).then(function (r) {
    if (!r.ok) return r.json().then(function (e) { throw new Error(e.error || r.statusText); });
    return r.json();
  }, function () {
    var err = new Error("the clipboard server isn't answering");
    err.unreachable = true;
    throw err;
  });
}

// A server that has been away through a few pastes is a problem to look into, not one to keep adding to
// (in this page's memory): so few are held, and no more than a total size; what isn't is said.
var HOLD_MAX_ITEMS = 3;
var HOLD_MAX_BYTES = 150 * 1024 * 1024;

function heldBytes() {
  return held.reduce(function (n, entry) { return n + entry.blob.size; }, 0);
}

// hold keeps what fits, and says how many items it couldn't (0 when all were kept).
function hold(entries) {
  var notKept = 0;
  entries.forEach(function (entry) {
    if (held.length < HOLD_MAX_ITEMS && heldBytes() + entry.blob.size <= HOLD_MAX_BYTES) held.push(entry);
    else notKept++;
  });
  showHeld();
  return notKept;
}

function notKeptText(n) {
  return "Not kept: " + (n === 1 ? "1 item" : n + " items") + ". The server has been away for a while, and only " +
    HOLD_MAX_ITEMS + " items, up to " + (HOLD_MAX_BYTES / (1024 * 1024)) + " MB, are held until it's back. Paste again then.";
}

function showHeld() {
  var box = document.getElementById("held");
  box.textContent = "";
  held.forEach(function (entry) {
    box.appendChild(el("article", { class: "item" }, [
      el("div", { class: "what" }, [
        el("div", { text: entry.name || (entry.blob.type || "pasted item") + " · " + formatSize(entry.blob.size) }),
        el("div", { class: "why", text: "waiting for the server — it'll be added when the server is back" }),
      ]),
      el("button", { text: "Drop", onclick: function () { held = held.filter(function (h) { return h !== entry; }); showHeld(); } }),
    ]));
  });
}

// sendHeld is what's held, once the server has answered.
function sendHeld() {
  if (!held.length) return;
  var entries = held;
  held = [];
  showHeld();
  uploadAll(entries);
}

window.addEventListener("beforeunload", function (e) {
  if (!held.length) return;
  e.preventDefault();
  e.returnValue = "";
});

function uploadAll(entries) {
  if (!entries.length) return;
  setStatus("Sending " + entries.length + (entries.length === 1 ? " item…" : " items…"));
  var unreachable = [];
  Promise.all(entries.map(function (e) {
    return upload(e.blob, e.name).catch(function (err) {
      if (!err.unreachable) throw err;
      unreachable.push(e);
      return null;
    });
  })).then(function (added) {
    var notKept = unreachable.length ? hold(unreachable) : 0;
    var extra = notKept ? " " + notKeptText(notKept) : "";
    added = added.filter(Boolean);
    if (!added.length) { setStatus(notKept ? notKeptText(notKept) : "", notKept > 0); return; }
    // One already waiting to go to the agent isn't added again.
    var already = added.filter(function (a) { return a.duplicate; }).length;
    var fresh = added.length - already;
    if (!fresh) setStatus((already === 1 ? "Already pasted: it's waiting to go with your next message." : "Already pasted, all " + already + ".") + extra, notKept > 0);
    else setStatus((fresh === 1 ? "Added — it'll reach the agent with your next message." : "Added " + fresh + " items.") +
      (already ? " (" + already + " already pasted.)" : "") + extra, notKept > 0);
    return refresh();
  }).catch(function (err) {
    setStatus("Couldn't add that: " + err.message, true);
  });
}

// fromTransfer collects what a paste or a drop carried: files (which is how
// browsers hand over pasted images), or else the text on its own.
function fromTransfer(dt) {
  return entriesFrom(dt.files, dt.getData("text/plain"));
}

// entriesFrom is the files, else the text, as things to upload. A pasted
// image is called "image.png" or the like, which says nothing: those are
// left for the server to name.
function entriesFrom(files, text) {
  var entries = [];
  Array.prototype.forEach.call(files || [], function (f) {
    entries.push({ blob: f, name: f.name && !/^image\.\w+$/.test(f.name) ? f.name : "" });
  });
  if (!entries.length && text) {
    entries.push({ blob: new Blob([text], { type: "text/plain;charset=utf-8" }), name: "" });
  }
  return entries;
}

document.addEventListener("paste", function (e) {
  var entries = fromTransfer(e.clipboardData);
  if (!entries.length) { setStatus("The clipboard had nothing this page can take.", true); return; }
  e.preventDefault();
  uploadAll(entries);
});

// The vibe companion page frames this one beside its conversation, so that
// pasting anywhere on that tab lands here: a paste only reaches the page that
// has focus, so the companion hands over what it carried. Taken from the
// page that framed this one and nobody else.
var phone = window.matchMedia("(max-width: 560px) and (pointer: coarse)");
var framedSplit = false;
if (new URLSearchParams(location.search).has("framed")) document.documentElement.classList.add("framed");
function applyLayout() {
  document.documentElement.classList.toggle("split", phone.matches || framedSplit);
}
phone.addEventListener("change", applyLayout);
applyLayout();

// parentOrigin is the origin of the companion page this page is shown in,
// learned from its messages, so typing can be passed only to it.
var parentOrigin = "";

window.addEventListener("message", function (e) {
  var d = e.data;
  if (window.parent === window || e.source !== window.parent) return;
  parentOrigin = e.origin;
  if (d && d.type === "vibe-clipboard-layout") {
    framedSplit = !!d.split;
    applyLayout();
    return;
  }
  if (!d || d.type !== "vibe-clipboard-paste") return;
  var files = Array.prototype.filter.call(d.files || [], function (f) { return f instanceof Blob; });
  var entries = entriesFrom(files, typeof d.text === "string" ? d.text : "");
  if (!entries.length) { setStatus("The clipboard had nothing this page can take.", true); return; }
  uploadAll(entries);
});

["dragenter", "dragover"].forEach(function (type) {
  document.addEventListener(type, function (e) { e.preventDefault(); dropEl.classList.add("over"); });
});
["dragleave", "drop"].forEach(function (type) {
  document.addEventListener(type, function (e) {
    if (type === "dragleave" && e.relatedTarget) return;
    dropEl.classList.remove("over");
  });
});
document.addEventListener("drop", function (e) {
  e.preventDefault();
  uploadAll(fromTransfer(e.dataTransfer));
});

document.getElementById("picker").addEventListener("change", function (e) {
  uploadAll(Array.prototype.map.call(e.target.files, function (f) { return { blob: f, name: f.name }; }));
  e.target.value = "";
});

zoomEl.addEventListener("click", function () { zoomEl.classList.remove("open"); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape") zoomEl.classList.remove("open"); });

// Beside the conversation, focus is easily left here (after a paste, say):
// a character typed while none of this page's own boxes has focus is meant
// for the prompt, so it's passed to the page this one is shown in.
document.addEventListener("keydown", function (e) {
  if (!parentOrigin || e.isComposing || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  var a = document.activeElement;
  if (a && (a.isContentEditable || a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "file"))) return;
  // Space presses a focused button, as it should.
  if (e.key === " " && a && a.tagName === "BUTTON") return;
  e.preventDefault();
  window.parent.postMessage({ type: "vibe-clipboard-key", key: e.key }, parentOrigin);
});

// asPNG converts an image blob to PNG: the one image type every browser's
// clipboard accepts.
function asPNG(blob) {
  if (blob.type === "image/png") return Promise.resolve(blob);
  return createImageBitmap(blob).then(function (bitmap) {
    var canvas = document.createElement("canvas");
    canvas.width = bitmap.width;
    canvas.height = bitmap.height;
    canvas.getContext("2d").drawImage(bitmap, 0, 0);
    return new Promise(function (resolve) { canvas.toBlob(resolve, "image/png"); });
  });
}

// copy puts the item on the user's own clipboard, and makes it the item
// Ctrl-V in the agent's terminal attaches.
function copy(item) {
  fetch("/api/items/" + item.id + "/current", { method: "POST" }).then(refresh);
  if (!navigator.clipboard || !window.ClipboardItem) {
    setStatus("This browser won't let the page write to the clipboard here — open it as http://localhost:… rather than by IP address.", true);
    return;
  }
  var done;
  if (item.kind === "image") {
    // The blob is handed over as a promise so the write still counts as part
    // of the click, which Safari insists on.
    var png = fetch(contentURL(item)).then(function (r) { return r.blob(); }).then(asPNG);
    done = navigator.clipboard.write([new ClipboardItem({ "image/png": png })]);
  } else if (item.kind === "text") {
    var text = fetch(contentURL(item)).then(function (r) { return r.text(); }).then(function (t) {
      return new Blob([t], { type: "text/plain" });
    });
    done = navigator.clipboard.write([new ClipboardItem({ "text/plain": text })]);
  } else {
    setStatus("Only images and text can go on the clipboard — this one is at " + item.path + " in the sandbox.", true);
    return;
  }
  done.then(function () { setStatus("Copied to your clipboard."); }).catch(function (err) {
    setStatus("Couldn't copy: " + err.message, true);
  });
}

function remove(item) {
  fetch("/api/items/" + item.id, { method: "DELETE" }).then(function (r) {
    if (!r.ok) throw new Error("the clipboard server said " + r.status);
    delete textCache[item.id];
    toast("Deleted.");
    return refresh();
  }).catch(function (err) {
    setStatus("Couldn't delete that: " + err.message, true);
  });
}

function clearAll() {
  fetch("/api/items", { method: "DELETE" }).then(function (r) {
    if (!r.ok) throw new Error("the clipboard server said " + r.status);
    return r.json();
  }).then(function (body) {
    textCache = {};
    toast(body.deleted === 1 ? "Deleted 1 item." : "Deleted " + body.deleted + " items.");
    return refresh();
  }).catch(function (err) {
    setStatus("Couldn't clear the clipboard: " + err.message, true);
  });
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
