# Kit fragment for the playwright feature, merged into the config.yaml of any
# profile composed with it.
permissions:
  network:
    allow:
      # Playwright itself
      - registry.npmjs.org
      # the browsers, from the CDN current versions name first, and the mirror they fall back to
      - cdn.playwright.dev
      - playwright.download.prss.microsoft.com
      # and from where older versions get them (a project may pin one: its own revision downloads into the same folder)
      - playwright.azureedge.net
      - playwright-akamai.azureedge.net
      - playwright-verizon.azureedge.net
      # The libraries the browsers need, and Node and npm, come from the image's own apt repositories (Debian's and
      # Docker Hardened Images'), which sandboxes may always reach: nothing to allow for them.
environment:
  variables:
    # Where the browsers are, for Playwright of any version in any project.
    PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
