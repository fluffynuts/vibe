# Kit fragment for the dotnet feature, merged into the config.yaml of any
# profile composed with it.
permissions:
  network:
    allow:
      # the SDK and runtime packages
      - packages.microsoft.com
      # dotnet-install.sh — aka.ms is where it redirects from
      - dot.net
      - aka.ms
      - builds.dotnet.microsoft.com
      - dotnetcli.azureedge.net
      - dotnetcli.blob.core.windows.net
      # NuGet restore
      - api.nuget.org
      - "*.nuget.org"
environment:
  variables:
    DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    DOTNET_NOLOGO: "1"
