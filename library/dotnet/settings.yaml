# Settings for the dotnet feature, merged into the settings.yaml of any
# profile composed with it. Without nugetDir set, vibe mounts nothing and
# passes no SBX_HOST_NUGET_PACKAGES, so the feature's own link-nuget has nothing
# to do and logs "unset — nothing to do". The `nuget` setting (fallback or shared) picks
# how the host's packages are given; see docs/adr/2026-10-18-nuget-without-the-hosts-nuget.md.
nugetDir: ~/.nuget
