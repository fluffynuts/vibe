# Kit fragment for the diffity feature, merged into the config.yaml of any
# profile composed with it.
permissions:
  network:
    allow:
      # npm — the diffity CLI (@naturalcycles/diffity) and its bundled skills
      - registry.npmjs.org
ports:
  - container: 5391
    protocol: tcp
    name: diffity
environment:
  variables:
    DIFFITY_HOST: "localhost"
