# Builds a zip for every platform on every push: the vibe binary plus the
# bundle it reads from beside itself (see make.sh's dist target, which does
# the packaging). The zips are attached to the workflow run as artifacts,
# and a push to master also publishes them as a GitHub release.
#
# Release versions are VERSION (major.minor, bumped by hand) plus the run
# number as the third part: 0.1.57. Every push to master is released, so the
# run number is what tells those releases apart, and it keeps each release a
# valid semantic version that GitHub sorts above the last.
name: build

on:
  push:
  workflow_dispatch:

# Reading the repo is all this needs: uploading a run's artifacts is
# authorised by the run itself, not by the token's permissions.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    # Every target is cross-compiled from Linux: vibe has no cgo, and zip(1)
    # there is what keeps the binary's executable bit in the archive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package
        id: dist
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The version's third part, in the zip's name and in the binary.
          BUILD: ${{ github.run_number }}
        run: |
          zip=$(./make.sh dist | tail -n 1)
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dist.outputs.zip }}
          # Upload the zip as it is: the artifact's own zipping would wrap it
          # in a second zip, and drops file permissions besides.
          archive: false
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Publishing a release creates its tag, which is a write to the repo;
    # only this job asks for that.
    permissions:
      contents: write
    # Two quick pushes must not race to publish.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vibe-*.zip
          merge-multiple: true
          path: dist
          # Keep the zips as they are. Left to itself this unpacks each one
          # into a folder, and re-zipping those would lose the executable
          # bit the package job's zip(1) kept.
          skip-decompress: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          version="$(tr -d '[:space:]' <VERSION).$BUILD"
          tag="v$version"
          # Found rather than globbed at dist/*.zip, so it doesn't matter
          # exactly where download-artifact puts them — and each one is
          # checked to be a zip before anything is published.
          mapfile -t zips < <(find dist -type f -name 'vibe-*.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no release zips found under dist/"
            find dist -ls
            exit 1
          fi
          # Published under fixed names (vibe-linux-amd64.zip, ...), so
          # releases/latest/download/<name> always works for the install
          # scripts and vibe --upgrade; the version is in the tag, in the
          # folder inside each zip, and in vibe --version. SHA256SUMS lets
          # them check a download before unpacking it.
          mkdir -p release
          for zip in "${zips[@]}"; do
            unzip -tq "$zip" >/dev/null || { echo "::error::$zip is not a valid zip"; exit 1; }
            name=$(basename "$zip")
            cp "$zip" "release/${name/-$version/}"
          done
          (cd release && sha256sum vibe-*.zip >SHA256SUMS)
          cat release/SHA256SUMS
          assets=(release/vibe-*.zip release/SHA256SUMS)
          notes=$(cat <<EOF
          Install or upgrade with the install script (see the readme), or \`vibe --upgrade\` once vibe
          is installed. Or by hand: download the zip for your platform, unzip it anywhere, and run
          \`vibe --install\` from the folder it makes.

          | Platform | Zip |
          |---|---|
          | Linux (x86-64) | \`vibe-linux-amd64.zip\` |
          | Linux (ARM) | \`vibe-linux-arm64.zip\` |
          | macOS (Apple Silicon) | \`vibe-macos-arm64.zip\` |
          | macOS (Intel) | \`vibe-macos-amd64.zip\` |
          | Windows (x86-64) | \`vibe-windows-amd64.zip\` |
          | Windows (ARM) | \`vibe-windows-arm64.zip\` |

          \`SHA256SUMS\` holds each zip's checksum. The install scripts and \`vibe --upgrade\` check it.

          macOS: the binary isn't signed, so if it's blocked after downloading in a browser, run
          \`xattr -dr com.apple.quarantine <folder>\` once.
          EOF
          )
          # A re-run of the same workflow run finds its release already made,
          # and replaces the zips rather than failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "vibe $version" \
              --notes "$notes" \
              --generate-notes \
              --latest
          fi
