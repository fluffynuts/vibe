# Builds a zip for every platform on every push: the vibe binary plus the
# bundle it reads from beside itself (see make.sh's dist target, which does
# the packaging). The zips are attached to the workflow run as artifacts,
# and a push to master also publishes them as a GitHub release.
#
# Release versions are VERSION (major.minor, bumped by hand) plus the run
# number as the third part: 0.1.57. Every push to master is released, so the
# run number is what tells those releases apart, and it keeps each release a
# valid semantic version that GitHub sorts above the last.
name: build

on:
  push:
  workflow_dispatch:

# Reading the repo is all this needs: uploading a run's artifacts is
# authorised by the run itself, not by the token's permissions.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # jsdom, for the companion page's tests: go test fails them without it
      # in CI rather than skipping.
      - run: npm ci --prefix internal/companion/uitest
      # Firefox, for the companion page's tests that need a real browser:
      # on Linux only (go test skips them elsewhere, but not in CI on Linux).
      - if: runner.os == 'Linux'
        working-directory: internal/companion/uitest
        run: npx playwright install --with-deps firefox
      # Formatting doesn't depend on the OS (every file is checked out with LF: see
      # .gitattributes), so once is enough. Changes nothing: it fails if a file would change.
      - if: runner.os == 'Linux'
        run: ./make.sh fmt-check
      - run: go vet ./...
      - run: go test ./...

  package:
    name: package (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    # Every target is cross-compiled from Linux: vibe has no cgo, and zip(1)
    # there is what keeps the binary's executable bit in the archive.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Package
        id: dist
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # The version's third part, in the zip's name and in the binary.
          BUILD: ${{ github.run_number }}
        run: |
          zip=$(./make.sh dist | tail -n 1)
          echo "zip=$zip" >>"$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.dist.outputs.zip }}
          # Upload the zip as it is: the artifact's own zipping would wrap it
          # in a second zip, and drops file permissions besides.
          archive: false
          if-no-files-found: error

  release:
    name: release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Publishing a release creates its tag, which is a write to the repo;
    # only this job asks for that. Reading pull requests finds the one a
    # push merged, for the notes.
    permissions:
      contents: write
      pull-requests: read
    # Two quick pushes must not race to publish.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: vibe-*.zip
          merge-multiple: true
          path: dist
          # Keep the zips as they are. Left to itself this unpacks each one
          # into a folder, and re-zipping those would lose the executable
          # bit the package job's zip(1) kept.
          skip-decompress: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
        run: |
          version="$(tr -d '[:space:]' <VERSION).$BUILD"
          tag="v$version"
          # Found rather than globbed at dist/*.zip, so it doesn't matter
          # exactly where download-artifact puts them — and each one is
          # checked to be a zip before anything is published.
          mapfile -t zips < <(find dist -type f -name 'vibe-*.zip' | sort)
          if [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::no release zips found under dist/"
            find dist -ls
            exit 1
          fi
          # Published under fixed names (vibe-linux-amd64.zip, ...), so
          # releases/latest/download/<name> always works for the install
          # scripts and vibe --upgrade; the version is in the tag, in the
          # folder inside each zip, and in vibe --version. SHA256SUMS lets
          # them check a download before unpacking it.
          mkdir -p release
          for zip in "${zips[@]}"; do
            unzip -tq "$zip" >/dev/null || { echo "::error::$zip is not a valid zip"; exit 1; }
            name=$(basename "$zip")
            cp "$zip" "release/${name/-$version/}"
          done
          (cd release && sha256sum vibe-*.zip >SHA256SUMS)
          cat release/SHA256SUMS
          assets=(release/vibe-*.zip release/SHA256SUMS)
          # The pull request this push merged, if it came from one: its title
          # and description head the notes. A push straight to master has none.
          # Not finding it is said, and the release goes ahead without it.
          # The description goes to a file, never into this script.
          pr_filter='[.[] | select(.merged_at != null)][0] | if . then "## \(.title) (#\(.number))\n\n\(.body // "")\n\n---\n" else "" end'
          if ! gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq "$pr_filter" >notes.md; then
            echo "::warning::couldn't look up the pull request $GITHUB_SHA came from: released without its summary"
            : >notes.md
          fi
          cat >>notes.md <<'EOF'
          To install:
          - Linux/macOS: `curl -fsSL https://raw.githubusercontent.com/fluffynuts/vibe/master/install.sh | sh`
          - Windows: `irm https://raw.githubusercontent.com/fluffynuts/vibe/master/install.ps1 | iex`
          - Manual: download the zip for your platform (below), unzip it anywhere, and run
            `vibe --install` from the folder it makes.

          To upgrade, run the same command again, or `vibe --upgrade` once vibe is installed.

          | Platform | Zip |
          |---|---|
          | Linux (x86-64) | `vibe-linux-amd64.zip` |
          | Linux (ARM) | `vibe-linux-arm64.zip` |
          | macOS (Apple Silicon) | `vibe-macos-arm64.zip` |
          | macOS (Intel) | `vibe-macos-amd64.zip` |
          | Windows (x86-64) | `vibe-windows-amd64.zip` |
          | Windows (ARM) | `vibe-windows-arm64.zip` |

          `SHA256SUMS` holds each zip's checksum. The install scripts and `vibe --upgrade` check it.

          macOS: the binary isn't signed, so if it's blocked after downloading in a browser, run
          `xattr -dr com.apple.quarantine <folder>` once.
          EOF
          # A re-run of the same workflow run finds its release already made,
          # and replaces the zips rather than failing.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "vibe $version" \
              --notes-file notes.md \
              --generate-notes \
              --latest
          fi
