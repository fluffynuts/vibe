# Re-runs a build job that never got a runner (see .github/scripts/rerun-if-no-runner.sh for what that is, and what is left alone), up to
# twice, so that nobody has to press retry for the runner pool's sake.
#
# A workflow_run workflow runs from the default branch's copy of this file, and with a token that can write: so it checks out only the
# default branch (never the code of the run it is looking at), takes the run's id from the event and nothing else, and looks at this
# repository's own runs only. It is in effect once it is on master.
name: rerun when no runner came

on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: >-
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled')
      && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: bash .github/scripts/rerun-if-no-runner.sh "$RUN_ID" "$ATTEMPT"
