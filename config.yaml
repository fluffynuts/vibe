schemaVersion: "2"
kind: mixin
name: vibe
displayName: vibe base kit
description: Permissions and tooling shared by every vibe profile
sourceURL: https://github.com/fluffynuts/vibe
requires:
  agent: claude
permissions:
  network:
    allow:
      # git and gh, which every sandbox needs whatever it is built for
      - github.com
      - "*.pkg.github.com"
      - codeload.github.com
      - objects.githubusercontent.com
      # apt — the defaults refresh the indexes for every profile
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - "*.ubuntu.com"
